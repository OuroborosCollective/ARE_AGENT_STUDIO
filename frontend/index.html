<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ARE Agent Studio — Mobile Signal Control Room</title>
  <meta name="description" content="Evidence-bound visual agent control: capture, learn, run and verify without hiding authority or provenance." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600;650;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'canvas-off-black': '#070B10',
            'surface': '#0C141C',
            'surface-deep': '#0D151D',
            'surface-raised': '#121D26',
            'surface-container': '#182029',
            'structural-steel': '#263540',
            'surface-container-high': '#232B33',
            'surface-container-highest': '#2E363E',
            'ink-primary': '#F4F7F8',
            'ink-secondary': '#B5C1C8',
            'ink-quiet': '#7D8B93',
            'signal-teal': '#67D9CF',
            'primary': '#85F6EB',
            'primary-container': '#67D9CF',
            'on-primary': '#003734',
            'status-disarmed': '#60727D',
            'status-alert': '#E05D52',
            'status-caution': '#E5A93C',
            'cyber': {
              dark: '#070B10',
              card: '#121D26',
              border: '#263540',
              neon: '#67D9CF',
              purple: '#121D26',
              amber: '#E5A93C',
              danger: '#E05D52'
            },
            brand: {
              50: '#E6FFFC',
              400: '#67D9CF',
              500: '#67D9CF',
              600: '#4DBEB4'
            }
          },
          borderRadius: {
            DEFAULT: '0.25rem',
            lg: '0.5rem',
            xl: '0.75rem',
            '2xl': '1rem',
            full: '9999px'
          },
          spacing: {
            'space-xs': '0.25rem',
            'space-sm': '0.5rem',
            'space-md': '0.75rem',
            'space-lg': '1rem',
            'space-xl': '1.5rem',
            gutter: '1rem',
            margin: '1rem'
          },
          fontFamily: {
            'body-default': ['Geist', 'sans-serif'],
            'body-secondary': ['Geist', 'sans-serif'],
            'workspace-title': ['Geist', 'sans-serif'],
            'screen-title-mobile': ['Geist', 'sans-serif'],
            'screen-title': ['Geist', 'sans-serif'],
            'section-title': ['Geist', 'sans-serif'],
            caption: ['Geist', 'sans-serif'],
            'mono-label': ['JetBrains Mono', 'monospace'],
            'mono-telemetry': ['JetBrains Mono', 'monospace'],
            'mono-receipt': ['JetBrains Mono', 'monospace'],
            mono: ['JetBrains Mono', 'monospace']
          },
          fontSize: {
            'body-default': ['16px', { lineHeight: '24px', letterSpacing: '0em', fontWeight: '400' }],
            'body-secondary': ['14px', { lineHeight: '20px', letterSpacing: '0.005em', fontWeight: '450' }],
            'mono-telemetry': ['13px', { lineHeight: '18px', letterSpacing: '-0.01em', fontWeight: '500' }],
            'mono-receipt': ['12px', { lineHeight: '16px', letterSpacing: '0em', fontWeight: '400' }],
            'workspace-title': ['22px', { lineHeight: '28px', letterSpacing: '-0.015em', fontWeight: '700' }],
            caption: ['12px', { lineHeight: '16px', letterSpacing: '0.01em', fontWeight: '500' }],
            'mono-label': ['11px', { lineHeight: '14px', letterSpacing: '0.06em', fontWeight: '600' }],
            'screen-title-mobile': ['26px', { lineHeight: '34px', letterSpacing: '-0.02em', fontWeight: '700' }],
            'screen-title': ['30px', { lineHeight: '38px', letterSpacing: '-0.02em', fontWeight: '700' }],
            'section-title': ['18px', { lineHeight: '24px', letterSpacing: '-0.01em', fontWeight: '650' }]
          }
        }
      }
    };
  </script>

  <style>
    :root {
      color-scheme: dark;
      --are-canvas: #070B10;
      --are-surface: #0C141C;
      --are-deep: #0D151D;
      --are-raised: #121D26;
      --are-structure: #263540;
      --are-primary: #F4F7F8;
      --are-secondary: #B5C1C8;
      --are-quiet: #7D8B93;
      --are-accent: #67D9CF;
      --are-alert: #E05D52;
      --are-caution: #E5A93C;
    }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: var(--are-canvas);
      color: var(--are-primary);
      font-family: 'Geist', sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    body { overflow-x: hidden; }
    #root { min-height: 100dvh; }
    ::-webkit-scrollbar { display: none; }
    button, input, select, textarea { font: inherit; }
    select {
      color-scheme: dark;
      border: 0;
      outline: 0;
      background: transparent;
    }
    option {
      background: var(--are-raised);
      color: var(--are-primary);
    }
    :focus-visible {
      outline: 2px solid var(--are-accent);
      outline-offset: 3px;
    }
    .signal-shell {
      position: relative;
      isolation: isolate;
      min-height: 100dvh;
      background:
        linear-gradient(180deg, rgba(7,11,16,0.96), rgba(7,11,16,0.99)),
        url('/assets/are-signal-hero.png') center / cover no-repeat;
    }
    .signal-shell::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.05;
      background: radial-gradient(circle at 18% 28%, rgba(103,217,207,0.18), transparent 34%);
    }
    .signal-shell > * { position: relative; z-index: 1; }
    .stitch-header {
      background: rgba(7,11,16,0.88);
      border-bottom: 1px solid rgba(38,53,64,0.72);
      backdrop-filter: blur(18px);
    }
    .stitch-surface {
      background: rgba(18,29,38,0.90);
      border: 1px solid rgba(38,53,64,0.95);
      box-shadow: 0 10px 30px rgba(0,0,0,0.20);
    }
    .stitch-muted-surface {
      background: rgba(13,21,29,0.88);
      border: 1px solid rgba(38,53,64,0.78);
    }
    .stitch-cta {
      background: var(--are-accent);
      color: #003734;
      box-shadow: none;
    }
    .stitch-cta:active { transform: translateY(1px); }
    .stitch-outline {
      background: rgba(12,20,28,0.72);
      color: var(--are-primary);
      border: 1px solid rgba(103,217,207,0.34);
    }
    .stitch-stage-rail {
      background: linear-gradient(180deg, rgba(38,53,64,0.95), rgba(38,53,64,0.16));
    }
    .stitch-status-cell {
      background: rgba(13,21,29,0.84);
      border: 1px solid rgba(38,53,64,0.78);
      min-height: 58px;
    }
    .studio-boot-fallback {
      display: grid;
      place-items: center;
      min-height: 100dvh;
      padding: 1.5rem;
      background:
        linear-gradient(180deg, rgba(7,11,16,0.96), rgba(7,11,16,0.99)),
        url('/assets/are-signal-hero.png') center / cover no-repeat;
    }
    .studio-boot-card {
      width: min(42rem, 100%);
      padding: 1.5rem;
      border: 1px solid rgba(103,217,207,0.30);
      border-radius: 0.75rem;
      background: rgba(18,29,38,0.94);
    }
    .studio-boot-kicker {
      margin: 0 0 0.75rem;
      color: var(--are-accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }
    .studio-boot-title { margin: 0; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.05; }
    .studio-boot-title strong { color: var(--are-accent); font-weight: inherit; }
    .studio-boot-copy { margin: 1rem 0 0; color: var(--are-secondary); font-size: 1rem; line-height: 1.6; }
    .studio-boot-status {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(38,53,64,0.84);
      color: var(--are-secondary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
    }
    .studio-boot-link { color: var(--are-accent); text-underline-offset: 0.18em; }
    @media (min-width: 769px) {
      .signal-shell { background: var(--are-canvas); }
    }
    @media (max-width: 768px) {
      .signal-shell::before { opacity: 0.035; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="bg-canvas-off-black text-ink-primary min-h-screen selection:bg-signal-teal selection:text-on-primary">
  <div id="root" data-are-mounted="false">
    <main class="studio-boot-fallback" aria-live="polite" aria-busy="true">
      <section class="studio-boot-card">
        <p class="studio-boot-kicker">ARE Agent Studio · Signal Control Room</p>
        <h1 class="studio-boot-title">Preparing the <strong>evidence-bound</strong> studio.</h1>
        <p class="studio-boot-copy">The interactive client is loading. Dataset writes, exports, and Android action output remain disabled in this public runtime.</p>
        <p class="studio-boot-status" data-are-boot-status>Starting verified client assets…</p>
      </section>
    </main>
  </div>
  <script>
    (() => {
      const root = document.getElementById('root');
      const status = root?.querySelector('[data-are-boot-status]');
      const showStartupFailure = () => {
        if (!root || root.dataset.areMounted === 'true') return;
        if (status) status.innerHTML = 'The interactive client did not start. <a class="studio-boot-link" href="/">Reload the Studio</a>.';
        root.querySelector('main')?.setAttribute('aria-busy', 'false');
      };
      window.addEventListener('error', showStartupFailure, true);
      window.setTimeout(() => {
        if (!root || root.dataset.areMounted === 'true') return;
        if (status) status.textContent = 'The interactive client is still starting. The public runtime keeps device actions and dataset writes disabled.';
      }, 8000);
    })();
  </script>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
