services:
  frontend:
    image: node:22-bookworm-slim
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "npm install --no-audit --no-fund --ignore-scripts && npm run dev"
    depends_on:
      - backend

  backend:
    image: node:22-bookworm-slim
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
    environment:
      - API_BACKEND_HOST=0.0.0.0
      - API_BACKEND_PORT=8080
      - DATASET_DIR=/app/backend/data
      - DATASET_WRITE_ENABLED=true
      - OPERATION_CORRECTION_DIR=/app/backend/data
      - VERIFIED_IMITATION_DIR=/app/backend/data
    command: node --watch server.js
