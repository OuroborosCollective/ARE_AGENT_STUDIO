name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm install --prefix frontend --no-audit --no-fund
      - name: Install public-site dependencies
        run: npm install --prefix marketing-site --ignore-scripts --no-audit --no-fund
      - name: Backend regression and syntax checks
        run: npm run test --prefix backend && npm run check --prefix backend
      - name: Frontend core regressions
        run: npm run test:core --prefix frontend
      - name: Frontend public-claim and visual-asset guards
        run: npm run test:ui-truth --prefix frontend
      - name: Frontend typecheck
        run: npm run typecheck --prefix frontend
      - name: Frontend production build
        run: npm run build --prefix frontend
      - name: Frontend production-entry regression
        run: npm run test:production-entry --prefix frontend
      - name: Docker image packaging
        run: docker build --tag are-agent-studio:ci .
      - name: Public-site metrics regression
        run: npm run test:metrics --prefix marketing-site
      - name: Public-site production build and Sites packaging
        run: npm run build --prefix marketing-site && npm run test:sites --prefix marketing-site
      - name: Dataset builder regressions
        run: python scripts/test_hf_dataset.py
      - name: Hugging Face presentation regressions
        run: python scripts/test_hf_presentation.py
      - name: Truth-path scan
        run: node scripts/truth_scan.mjs
      - name: Determinism scan
        run: node scripts/determinism_scan.mjs
      - name: Forge architecture guard
        run: node scripts/forge_truth_guard.mjs
      - name: Forge runner tests
        run: cd forge-runner && node --test
      - name: Forge dataset pipeline regressions
        run: python scripts/test_hf_forge_dataset.py
      - name: Forge dataset dry-run packaging
        run: python scripts/prepare_hf_forge_dataset.py --ledger /dev/null --output /tmp/forge-dry-run || true
      - name: Secret and credential scan
        run: node scripts/forge_secret_scan.mjs
      - name: Contract-drift guard
        run: node scripts/forge_contract_drift_guard.mjs
      - name: Hugging Face Space packaging preflight
        run: python scripts/publish_hf_space.py --repo-id local/ci-preflight --dry-run
